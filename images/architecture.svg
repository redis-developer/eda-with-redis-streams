<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Two-lane architecture of the Redis Streams EDA demo">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8896a0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#FF4438">Redis Streams EDA demo</text>
  <text x="40" y="65" font-size="14" fill="#6d7c87">Two lanes, one timing view — the same workload over Redis Streams and over Kafka (via Korvet)</text>

  <!-- ===================== LANE A ===================== -->
  <text x="40" y="98" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#0a5d6d">LANE A · NATIVE REDIS STREAMS</text>

  <!-- producer -->
  <rect x="40" y="112" width="112" height="50" rx="8" fill="#ffffff" stroke="#cbd5db" stroke-width="1.5"/>
  <text x="96" y="134" font-size="13" font-weight="700" fill="#09151d" text-anchor="middle">producer</text>
  <text x="96" y="150" font-size="11" fill="#6d7c87" text-anchor="middle">Java client</text>

  <!-- transactions stream (Redis) -->
  <rect x="192" y="108" width="140" height="58" rx="8" fill="#fdecea" stroke="#FF4438" stroke-width="1.8"/>
  <text x="262" y="132" font-size="13" font-weight="700" fill="#0b1f2c" text-anchor="middle">transactions</text>
  <text x="262" y="149" font-size="11" fill="#8a2a22" text-anchor="middle">Redis Stream</text>

  <!-- consumer groups -->
  <rect x="392" y="70" width="176" height="36" rx="8" fill="#eef2f4" stroke="#cbd5db" stroke-width="1.4"/>
  <text x="480" y="93" font-size="12.5" fill="#09151d" text-anchor="middle"><tspan font-weight="700">metrics-cg</tspan> · analytics</text>

  <rect x="392" y="114" width="176" height="36" rx="8" fill="#eef2f4" stroke="#cbd5db" stroke-width="1.4"/>
  <text x="480" y="137" font-size="12.5" fill="#09151d" text-anchor="middle"><tspan font-weight="700">alerts-cg</tspan> · derived alerts</text>

  <rect x="392" y="158" width="176" height="36" rx="8" fill="#eef2f4" stroke="#cbd5db" stroke-width="1.4"/>
  <text x="480" y="181" font-size="12.5" fill="#09151d" text-anchor="middle"><tspan font-weight="700">monitor-cg</tspan> · dashboard</text>

  <rect x="392" y="202" width="176" height="36" rx="8" fill="#e1f0f2" stroke="#0f7b8f" stroke-width="1.8"/>
  <text x="480" y="225" font-size="12.5" fill="#0a3d47" text-anchor="middle"><tspan font-weight="700">probe-redis-cg</tspan> · latency</text>

  <!-- Lane A arrows -->
  <line x1="152" y1="137" x2="188" y2="137" stroke="#8896a0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="170" y="128" font-size="10.5" fill="#6d7c87" text-anchor="middle">XADD</text>
  <line x1="332" y1="137" x2="388" y2="88" stroke="#8896a0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="332" y1="137" x2="388" y2="132" stroke="#8896a0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="332" y1="137" x2="388" y2="176" stroke="#8896a0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="332" y1="137" x2="388" y2="220" stroke="#8896a0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="118" font-size="10.5" fill="#6d7c87" text-anchor="middle">XREADGROUP</text>

  <!-- ===================== LANE B ===================== -->
  <text x="40" y="290" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#5b3ea8">LANE B · KAFKA ON REDIS (KORVET)</text>

  <!-- kafka-producer -->
  <rect x="40" y="304" width="120" height="50" rx="8" fill="#ffffff" stroke="#cbd5db" stroke-width="1.5"/>
  <text x="100" y="326" font-size="12.5" font-weight="700" fill="#09151d" text-anchor="middle">kafka-producer</text>
  <text x="100" y="342" font-size="11" fill="#6d7c87" text-anchor="middle">Kafka client</text>

  <!-- Korvet -->
  <rect x="200" y="300" width="186" height="58" rx="8" fill="#efeafe" stroke="#8a5cf6" stroke-width="1.8"/>
  <text x="293" y="324" font-size="13" font-weight="700" fill="#3a2a6b" text-anchor="middle">Korvet</text>
  <text x="293" y="341" font-size="11" fill="#5b3ea8" text-anchor="middle">topic: kafka-transactions</text>

  <!-- kafka-probe -->
  <rect x="426" y="304" width="142" height="50" rx="8" fill="#efeafe" stroke="#8a5cf6" stroke-width="1.8"/>
  <text x="497" y="326" font-size="12.5" font-weight="700" fill="#3a2a6b" text-anchor="middle">kafka-probe</text>
  <text x="497" y="342" font-size="11" fill="#5b3ea8" text-anchor="middle">consumer group</text>

  <!-- Lane B arrows -->
  <line x1="160" y1="329" x2="196" y2="329" stroke="#8896a0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="178" y="320" font-size="10.5" fill="#6d7c87" text-anchor="middle">produce</text>
  <line x1="386" y1="329" x2="422" y2="329" stroke="#8896a0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="404" y="320" font-size="10.5" fill="#6d7c87" text-anchor="middle">consume</text>
  <text x="200" y="380" font-size="11.5" fill="#5b3ea8">standard Kafka client — the only change from Apache Kafka is <tspan font-style="italic">bootstrap.servers</tspan></text>

  <!-- ===================== TIMING VIEW ===================== -->
  <rect x="610" y="112" width="310" height="246" rx="12" fill="#ffffff" stroke="#FF4438" stroke-width="2"/>
  <text x="628" y="140" font-size="15" font-weight="700" fill="#09151d">Monitor API &#8594; Dashboard</text>
  <text x="628" y="160" font-size="12.5" fill="#6d7c87">End-to-end latency, per lane</text>
  <line x1="628" y1="174" x2="902" y2="174" stroke="#e3d9cf" stroke-width="1"/>

  <rect x="628" y="192" width="14" height="14" rx="3" fill="#0f7b8f"/>
  <text x="652" y="204" font-size="12.5" font-weight="700" fill="#09151d">Redis Streams</text>
  <rect x="628" y="214" width="150" height="9" rx="4" fill="#0f7b8f"/>

  <rect x="628" y="250" width="14" height="14" rx="3" fill="#8a5cf6"/>
  <text x="652" y="262" font-size="12.5" font-weight="700" fill="#09151d">Korvet</text>
  <rect x="628" y="272" width="176" height="9" rx="4" fill="#8a5cf6"/>

  <text x="628" y="312" font-size="11.5" fill="#6d7c87">p50 · p95 · throughput,</text>
  <text x="628" y="329" font-size="11.5" fill="#6d7c87">measured live and side by side</text>

  <!-- probes feed the timing view -->
  <line x1="568" y1="220" x2="606" y2="205" stroke="#8896a0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="568" y1="329" x2="606" y2="300" stroke="#8896a0" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Footer -->
  <line x1="40" y1="410" x2="920" y2="410" stroke="#eee6dc" stroke-width="1"/>
  <text x="40" y="434" font-size="11.5" fill="#6d7c87">One Redis backs both lanes: the <tspan font-weight="700">transactions</tspan> stream and Korvet's topic storage (<tspan font-family="monospace">korvet:storage:local:kafka-transactions:0</tspan>).</text>
  <text x="40" y="452" font-size="11.5" fill="#6d7c87">Every event carries a producer timestamp; each lane's probe reports latency = consume time &#8722; timestamp.</text>
</svg>
