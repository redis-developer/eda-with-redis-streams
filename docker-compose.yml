name: streams

services:
  redis-database:
    container_name: redis-database
    hostname: redis-database
    image: redis:8.8.0
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis-insight:
    container_name: redis-insight
    hostname: redis-insight
    image: redis/redisinsight:3.4.2
    depends_on:
      - redis-database
    environment:
      RI_REDIS_HOST: "redis-database"
      RI_REDIS_PORT: "6379"
    ports:
      - "5540:5540"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://redis-insight:5540/api/health | grep -q '\"status\":\"up\"'"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis-korvet:
    container_name: redis-korvet
    hostname: redis-korvet
    image: redisfield/korvet:latest
    pull_policy: always
    depends_on:
      redis-database:
        condition: service_healthy
    environment:
      KORVET_REDIS_URI: redis://redis-database:6379
      KORVET_BROKER_ADVERTISED_HOST: redis-korvet
      KORVET_STORAGE_LOCAL_COMPRESSION_CODEC: none
      KORVET_TOPICS_0_NAME: "transactions"
      KORVET_TOPICS_0_AUTO_CREATE: true
      KORVET_TOPICS_0_PARTITIONS: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: echo srvr | nc redis-korvet 9092 || exit 1
      interval: 5s
      retries: 10

  kafka-tools:
    container_name: kafka-tools
    image: apache/kafka
    command: sleep infinity
    depends_on:
      redis-korvet:
        condition: service_healthy

  kafka-connect:
    container_name: kafka-connect
    hostname: kafka-connect
    image: fieldengineering/redis-kafka-connect
    pull_policy: always
    depends_on:
      redis-korvet:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redis-korvet:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: eda-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  connect-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      kafka-connect:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Registering Redis sink connector..."
        until curl -fsS -X PUT http://kafka-connect:8083/connectors/redis-transactions-sink/config \
          -H "Content-Type: application/json" \
          -d '{
            "connector.class": "com.redis.kafka.connect.RedisSinkConnector",
            "tasks.max": "1",
            "topics": "transactions",
            "redis.uri": "redis://redis-database:6379",
            "redis.type": "STREAM",
            "redis.keyspace": "transactions",
            "key.converter": "org.apache.kafka.connect.storage.StringConverter",
            "value.converter": "org.apache.kafka.connect.json.JsonConverter",
            "value.converter.schemas.enable": "false",
            "transforms": "rename,addTimestamp",
            "transforms.rename.type": "org.apache.kafka.connect.transforms.ReplaceField$$Value",
            "transforms.rename.renames": "txnId:txn_id,riskScore:risk_score",
            "transforms.addTimestamp.type": "org.apache.kafka.connect.transforms.InsertField$$Value",
            "transforms.addTimestamp.timestamp.field": "timestamp",
            "consumer.override.auto.offset.reset": "earliest"
          }'; do
          echo "Connect not ready to accept the connector (starting or rebalancing); retrying in 5s..."
          sleep 5
        done
        echo "Redis sink connector registered."

  producer:
    build: .
    command: ["io.redis.devrel.demo.eda.producer.TransactionProducer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      PRODUCER_RATE_PER_SECOND: "100"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  metrics-1:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.MetricsConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      METRICS_CONSUMER_NAME: metric-1
      METRICS_PROCESSING_DELAY_MS: "11"
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  metrics-2:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.MetricsConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      METRICS_CONSUMER_NAME: metric-2
      METRICS_PROCESSING_DELAY_MS: "11"
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  monitor-api:
    build: .
    command: ["io.redis.devrel.demo.eda.web.MonitorApiServer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      MONITOR_API_PORT: "8080"
      MONITOR_CONSUMER_NAME: "monitor-web-ui"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  monitor-web:
    build:
      context: .
      dockerfile: monitor-web/Dockerfile
    ports:
      - "8088:80"
    restart: on-failure
    depends_on:
      monitor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  alerts:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.AlertConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      ALERTS_CONSUMER_NAME: alert-engine
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
