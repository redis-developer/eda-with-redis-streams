name: streams

services:
  redis-database:
    container_name: redis-database
    hostname: redis-database
    image: redis:8.8.0
    ports:
      # Published on 6380 to avoid clashing with a Redis already running on the host's 6379.
      # Everything inside the compose network still talks to redis-database:6379.
      - "6380:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis-insight:
    container_name: redis-insight
    hostname: redis-insight
    image: redis/redisinsight:3.4.2
    depends_on:
      - redis-database
    environment:
      RI_REDIS_HOST: "redis-database"
      RI_REDIS_PORT: "6379"
    ports:
      - "5540:5540"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://redis-insight:5540/api/health | grep -q '\"status\":\"up\"'"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis-korvet:
    container_name: redis-korvet
    hostname: redis-korvet
    image: redisfield/korvet:latest
    pull_policy: always
    depends_on:
      redis-database:
        condition: service_healthy
    environment:
      KORVET_REDIS_URI: redis://redis-database:6379
      KORVET_BROKER_ADVERTISED_HOST: redis-korvet
      KORVET_STORAGE_LOCAL_COMPRESSION_CODEC: none
      KORVET_TOPICS_0_NAME: "kafka-transactions"
      KORVET_TOPICS_0_AUTO_CREATE: true
      KORVET_TOPICS_0_PARTITIONS: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: nc -z redis-korvet 9092 || exit 1
      interval: 5s
      retries: 10

  kafka-tools:
    container_name: kafka-tools
    image: apache/kafka
    command: sleep infinity
    depends_on:
      redis-korvet:
        condition: service_healthy

  producer:
    build: .
    command: ["io.redis.devrel.demo.eda.producer.TransactionProducer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      PRODUCER_RATE_PER_SECOND: "100"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  metrics-1:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.MetricsConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      METRICS_CONSUMER_NAME: metric-1
      METRICS_PROCESSING_DELAY_MS: "11"
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  metrics-2:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.MetricsConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      METRICS_CONSUMER_NAME: metric-2
      METRICS_PROCESSING_DELAY_MS: "11"
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  monitor-api:
    build: .
    command: ["io.redis.devrel.demo.eda.web.MonitorApiServer"]
    ports: 
      - "8080:8080"
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      MONITOR_API_PORT: "8080"
      MONITOR_CONSUMER_NAME: "monitor-web-ui"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  monitor-web:
    build:
      context: .
      dockerfile: monitor-web/Dockerfile
    ports:
      - "8088:80"
    restart: on-failure
    depends_on:
      monitor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  alerts:
    build: .
    command: ["io.redis.devrel.demo.eda.consumer.AlertConsumer"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      ALERTS_CONSUMER_NAME: alert-engine
      AUTOCLAIM_IDLE_THRESHOLD_MS: "10000"
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # --- Lane A timing probe: reads the native Redis stream and measures end-to-end latency ---
  redis-probe:
    build: .
    command: ["io.redis.devrel.demo.eda.probe.RedisLatencyProbe"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      PROBE_CONSUMER_NAME: redis-probe
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # --- Lane B producer: the same workload over the Kafka protocol, served by Korvet ---
  kafka-producer:
    build: .
    command: ["io.redis.devrel.demo.eda.producer.KafkaTransactionProducer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redis-korvet:9092
      KAFKA_TOPIC: kafka-transactions
      PRODUCER_RATE_PER_SECOND: "100"
    init: true
    restart: on-failure
    depends_on:
      redis-korvet:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # --- Lane B timing probe: a standard Kafka consumer group against Korvet ---
  kafka-probe:
    build: .
    command: ["io.redis.devrel.demo.eda.probe.KafkaLatencyProbe"]
    environment:
      REDIS_HOST: redis-database
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: redis-korvet:9092
      KAFKA_TOPIC: kafka-transactions
      KAFKA_PROBE_GROUP: probe-korvet
    init: true
    restart: on-failure
    depends_on:
      redis-database:
        condition: service_healthy
      redis-korvet:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
